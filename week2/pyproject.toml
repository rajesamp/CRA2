[project]
name = "cra2-week2"
version = "0.1.0"
description = "CRA2 LangGraph orchestration and local MCP tools"
requires-python = ">=3.10,<3.14"
dependencies = [
    "cra2",
    "langgraph>=1,<2",
    "mcp>=1,<2",
    "anyio>=4,<5",
    "jsonschema>=4,<5",
    "langsmith>=0.4,<1",
    # Preserve the checksum-pinned encoder artifacts across library updates.
    "fastembed==0.9.1",
    "numpy>=2,<3",
    "gradio>=6,<7",
    "slack-bolt>=1,<2",
    "nemoguardrails==0.24.1",
    "pyjwt[crypto]>=2.15,<3",
    "fastapi>=0.143,<1",
    "uvicorn>=0.54,<1",
    "httpx>=0.28,<1",
]

[dependency-groups]
dev = ["pytest>=8,<10"]

[tool.uv]
package = false
required-environments = ["sys_platform == 'darwin' and platform_machine == 'x86_64'"]
# Pillow 13 contains the reported security fixes and requires Python >=3.11.
# The Cloud Run image uses 3.13; 3.10 remains a local compatibility test only.
constraint-dependencies = ["pillow>=13; python_version >= '3.11'"]

[tool.uv.sources]
cra2 = { path = "..", editable = true }
