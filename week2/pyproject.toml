[project]
name = "cra2-week2"
version = "0.1.0"
description = "CRA2 LangGraph orchestration and local MCP tools"
requires-python = ">=3.10,<3.14"
dependencies = [
    "cra2",
    "langgraph>=1,<2",
    "mcp>=1,<2",
    "anyio>=4,<5",
    "jsonschema>=4,<5",
    "langsmith>=0.4,<1",
    # Preserve the existing local index's encoder identity.
    "fastembed==0.8.1",
    "numpy>=2,<3",
    "gradio>=6,<7",
    "slack-bolt>=1,<2",
]

[dependency-groups]
dev = ["pytest>=8,<10"]

[tool.uv]
package = false
required-environments = ["sys_platform == 'darwin' and platform_machine == 'x86_64'"]

[tool.uv.sources]
cra2 = { path = "..", editable = true }
