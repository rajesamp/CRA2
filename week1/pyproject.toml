[project]
name = "cra2-week1"
version = "0.1.0"
description = "Additive Week 1 Gradio and local vector-retrieval prototype for CRA2"
requires-python = ">=3.10,<3.14"
dependencies = [
    "cra2",
    "gradio>=6,<7",
    "fastembed>=0.7,<1",
    "numpy>=2,<3",
]

[dependency-groups]
dev = ["pytest>=8,<10"]

[tool.uv]
package = false
required-environments = ["sys_platform == 'darwin' and platform_machine == 'x86_64'"]

[tool.uv.sources]
cra2 = { path = "..", editable = true }
