[project]
name = "cra2"
version = "0.1.0"
description = "ChangeRiskAdvisor 2 - fast, deterministic, advisory-only change-risk assessment on Groq"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "groq>=1.7.0",
    "python-dotenv>=1.0.1",
]

[project.scripts]
cra2 = "cra2.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cra2"]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
