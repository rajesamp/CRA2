[project]
name = "cra2"
version = "0.1.0"
description = "ChangeRiskAdvisor 2 - local rules and optional Groq analysis for advisory change-risk assessment"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "groq>=1.7.0",
    "python-dotenv>=1.0.1",
]

[project.scripts]
cra2 = "cra2.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cra2"]

# Keep one canonical copy in the repository and bundle it inside installed wheels.
[tool.hatch.build.targets.wheel.force-include]
"data/checkout_system.json" = "cra2/data/checkout_system.json"
"data/incidents.json" = "cra2/data/incidents.json"
"data/sample_incidents.json" = "cra2/data/sample_incidents.json"
"data/team_settings.json" = "cra2/data/team_settings.json"
"evals/cases.json" = "cra2/evals/cases.json"

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: opt-in tests that send data to Groq and may incur charges"]
